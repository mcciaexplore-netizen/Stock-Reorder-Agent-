<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stocklist offline entry</title><style>body{font:16px system-ui;color:#193a31;background:#f4f7f5;max-width:680px;margin:auto;padding:24px}label{display:block;margin:16px 0 5px}input,select,button,textarea{font:inherit;padding:12px;box-sizing:border-box;width:100%;border:1px solid #a4b6ad;border-radius:6px}button{background:#1e6352;color:white;cursor:pointer;margin-top:16px}article{background:white;border:1px solid #ced9d3;padding:12px;margin-top:10px}video{width:100%}.secondary{background:white;color:#193a31}#notice{font-weight:bold}</style>
<h1>Stocklist offline entry</h1><p>Record stock movements without an internet connection. Export the queue and upload it in Stocklist for validation. Entries do not reserve stock or update live balances.</p>
<form id="entry"><label>Scan barcode or enter SKU</label><input id="sku" list="products" required autocomplete="off"><datalist id="products"></datalist>
<button type="button" class="secondary" id="scan">Scan with camera (supported browsers)</button><video id="camera" hidden playsinline></video>
<label>Location</label><select id="location"></select><label>Movement</label><select id="kind"><option value="receipt">Receipt</option><option value="issue">Internal use</option><option value="sale">Sale</option><option value="customer_return">Customer return</option><option value="supplier_return">Supplier return</option><option value="damage">Damage</option></select>
<label>Quantity in stock units</label><input id="quantity" type="number" min="0.001" step="0.001" required value="1"><label>Batch / serial number</label><select id="batch"><option value="">Automatic for dispatch / not tracked</option></select>
<label>Reason</label><input id="reason" required maxlength="500"><label>Reference</label><input id="reference" maxlength="200"><button>Save to offline queue</button></form>
<p id="notice" role="status"></p><h2 id="count"></h2><button id="download">Download queue for upload</button><button class="secondary" id="clear">Clear queue after successful import</button><div id="queue"></div>
<script>
'use strict';const data=__STOCKLIST_DATA__;const el=id=>document.getElementById(id);const storage='stocklist.offline.v1.'+data.workspace_id;let queue=[];
try{queue=JSON.parse(localStorage.getItem(storage)||'[]');if(!Array.isArray(queue))queue=[]}catch(e){el('notice').textContent='Saved queue unavailable. Keep downloaded copies.'}
for(const p of data.products){const o=document.createElement('option');o.value=p.sku;o.textContent=p.name;el('products').append(o)}
for(const l of data.locations){const o=document.createElement('option');o.value=l;o.textContent=l;el('location').append(o)}
function selectedProduct(){const value=el('sku').value.trim();return data.products.find(p=>p.sku.toLowerCase()===value.toLowerCase()||(p.barcode&&p.barcode===value))}
function refreshBatches(){const p=selectedProduct();el('batch').replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent=p&&p.tracking!=='none'?'Choose batch / automatic dispatch':'Not tracked';el('batch').append(blank);for(const b of data.batches.filter(b=>p&&b.sku===p.sku)){const o=document.createElement('option');o.value=b.id;o.textContent=b.code+(b.expiry?' · expiry '+b.expiry:'');el('batch').append(o)}}
el('sku').addEventListener('input',refreshBatches);
function render(){el('count').textContent=queue.length+' queued movements';el('queue').replaceChildren();for(const r of queue){const a=document.createElement('article');a.textContent=r.sku+' · '+r.kind+' · '+r.quantity+' · '+r.location+' · '+r.reference;el('queue').append(a)}}
function persist(){try{localStorage.setItem(storage,JSON.stringify(queue));return true}catch(e){el('notice').textContent='Browser storage unavailable. Download this queue before closing.';return false}}
el('entry').addEventListener('submit',e=>{e.preventDefault();const p=selectedProduct();if(!p){el('notice').textContent='Unknown SKU or barcode.';return}if(p.tracking!=='none'&&!el('batch').value&&el('kind').value==='receipt'){el('notice').textContent='Choose a batch or serial number. Download a fresh sheet if it was created after this sheet.';return}queue.push({id:crypto.randomUUID(),workspace_id:data.workspace_id,sku:p.sku,location:el('location').value,kind:el('kind').value,quantity:el('quantity').value,reason:el('reason').value,reference:el('reference').value,batch_id:el('batch').value?Number(el('batch').value):null});el('notice').textContent='Saved locally. Upload the queue when connected.';persist();render();});
el('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(queue,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='stocklist-offline-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('clear').onclick=()=>{if(confirm('Only clear after exporting and checking every imported row. Clear this local queue?')){queue=[];persist();render()}};
el('scan').onclick=async()=>{if(!('BarcodeDetector' in window)||!navigator.mediaDevices){el('notice').textContent='Camera scanning is unavailable in this browser. Use a keyboard barcode scanner or enter the SKU.';return}let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});el('camera').srcObject=stream;el('camera').hidden=false;await el('camera').play();const detector=new BarcodeDetector();const end=Date.now()+15000;while(Date.now()<end){const codes=await detector.detect(el('camera'));if(codes.length){el('sku').value=codes[0].rawValue;refreshBatches();break}await new Promise(r=>setTimeout(r,200))}}catch(e){el('notice').textContent='Camera could not be used. Enter the SKU or use a keyboard scanner.'}finally{if(stream)stream.getTracks().forEach(t=>t.stop());el('camera').hidden=true}};render();
</script></html>
