[theme]
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "'Plus Jakarta Sans', 'Segoe UI', sans-serif"
headingFont = "'Plus Jakarta Sans', 'Segoe UI', sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "26px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
greenColor = "#059669"
greenTextColor = "#065F46"
greenBackgroundColor = "#ECFDF5"
linkColor = "#0284C7"
chartCategoricalColors = ["#0284C7", "#059669", "#D97706", "#64748B", "#E11D48"]

[theme.sidebar]
font = "'Plus Jakarta Sans', 'Segoe UI', sans-serif"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"

[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"

[browser]
gatherUsageStats = false
